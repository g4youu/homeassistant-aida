name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: aida/Dockerfile
          config: .hadolint.yaml

      - name: ShellCheck scripts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -s bash -S error aida/run.sh aida/scripts/*.sh

      - name: Validate add-on config
        run: |
          python3 - <<'PY'
          import sys, yaml
          for f in ("aida/config.yaml", "aida/build.yaml"):
              with open(f) as fh:
                  yaml.safe_load(fh)
              print("ok:", f)
          cfg = yaml.safe_load(open("aida/config.yaml"))
          for key in ("name", "version", "slug", "arch"):
              assert key in cfg, f"missing required key: {key}"
          print("config.yaml has required keys")
          PY

      - name: Home Assistant add-on linter
        uses: frenck/action-addon-linter@v2
        continue-on-error: true
        with:
          path: "./aida"

  test:
    name: Shell tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run test suite
        run: bash tests/test-run.sh   # bash + jq are preinstalled on the runner

  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            base: ghcr.io/home-assistant/amd64-base-debian:bookworm
            platform: linux/amd64
          - arch: aarch64
            base: ghcr.io/home-assistant/aarch64-base-debian:bookworm
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        if: matrix.arch == 'aarch64'
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: ./aida
          file: ./aida/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_FROM=${{ matrix.base }}
          push: false
          load: true
          tags: local/aida:ci

      # Native runtime checks only on amd64 (the runner's own arch).
      - name: Smoke test — Claude Code CLI starts
        if: matrix.arch == 'amd64'
        run: docker run --rm --entrypoint bash local/aida:ci -c 'timeout 40 claude --version'

      - name: Smoke test — ha-mcp imports and starts (numpy<2)
        if: matrix.arch == 'amd64'
        run: |
          docker run --rm --entrypoint bash local/aida:ci -c \
            'timeout 200 uvx --index-strategy unsafe-best-match --with "numpy<2" ha-mcp@3.5.1 </dev/null 2>&1 | head -15' \
            | tee ha-mcp.out
          grep -qiE "Starting MCP server|FastMCP" ha-mcp.out
